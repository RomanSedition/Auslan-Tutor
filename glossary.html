<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glossary — Auslan Tutor</title>
  <meta name="description" content="Every Auslan sign taught in Auslan Tutor, with Signbank videos. Search by English word or category.">
  <link rel="canonical" href="https://romansedition.github.io/Auslan-Tutor/glossary.html">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤟</text></svg>">
  <link rel="stylesheet" href="assets/app.css?v=bfe8546879">
</head>
<body>
<main class="wrap">
  <section class="hero" style="padding-bottom:0">
    <h1>Glossary</h1>
    <p>Every sign from your lessons, A–Z. The dot shows how well you know it from Review: <span class="conf good"></span> good · <span class="conf hard"></span> hard · <span class="conf again"></span> again · <span class="conf"></span> not reviewed yet.</p>
  </section>

  <div class="toolbar">
    <input type="search" id="q" placeholder="Search signs or English…" autofocus>
    <select id="lesson"><option value="done">✓ Known (completed lessons)</option><option value="">All lessons</option></select>
    <select id="cat">
      <option value="vocab">Vocabulary</option>
      <option value="fingerspelling">Fingerspelling</option>
      <option value="">Everything</option>
    </select>
  </div>
  <div id="out"></div>
</main>

<script src="assets/app.js?v=81682a8e30"></script>
<script>
(async () => {
  const { h, loadLessons, loadSigns, progress, store } = AuslanTutor;
  const [lessons, signs] = await Promise.all([loadLessons(), loadSigns()]);
  const q = document.getElementById("q"), lessonSel = document.getElementById("lesson"), cat = document.getElementById("cat");
  lessons.forEach((l) => lessonSel.append(h("option", { value: l.id }, `${l.id}. ${l.title}`)));
  cat.value = store.get("auslan.glossary.cat", "vocab");
  lessonSel.value = store.get("auslan.glossary.lesson", "done");
  const completed = () => lessons.filter((l) => progress.lessons[l.id]).length;
  const inScope = (s) => {
    const v = lessonSel.value;
    if (!v) return true;
    if (v === "done") return s.lessons.some((id) => progress.lessons[id]);
    return s.lessons.includes(+v);
  };
  const showAll = () => { lessonSel.value = ""; render(); };

  function render() {
    store.set("auslan.glossary.cat", cat.value);
    store.set("auslan.glossary.lesson", lessonSel.value);
    const term = q.value.trim().toLowerCase();
    const matching = Object.entries(signs)
      .filter(([k, s]) => !cat.value || s.category === cat.value)
      .filter(([k, s]) => !term || [s.label, s.english, s.hint, k].join(" ").toLowerCase().includes(term));
    const items = matching.filter(([k, s]) => inScope(s)).sort((a, b) => a[1].label.localeCompare(b[1].label));
    const hidden = matching.length - items.length; // matches outside the current lesson filter

    const out = document.getElementById("out");
    const more = hidden && lessonSel.value
      ? h("p", { class: "muted", style: "margin:0 0 12px" }, `${hidden} more sign${hidden > 1 ? "s" : ""} in other lessons. `,
          h("a", { href: "#", onclick: (e) => { e.preventDefault(); showAll(); } }, "Show all lessons"))
      : null;
    if (lessonSel.value === "done" && !completed()) {
      out.replaceChildren(h("div", { class: "empty" },
        h("p", { style: "font-size:2rem;margin:0" }, "📚"),
        h("p", {}, "Your known signs will appear here once you've marked a lesson complete (the button at the top of each lesson)."),
        h("button", { class: "btn", onclick: showAll }, "Show every sign")));
      return;
    }
    if (!items.length) { out.replaceChildren(h("p", { class: "empty" }, "No signs match."), ...(more ? [more] : [])); return; }
    const groups = {};
    for (const it of items) (groups[it[1].label[0].toUpperCase()] ||= []).push(it);
    out.replaceChildren(...(more ? [more] : []), ...Object.entries(groups).flatMap(([letter, list]) => [
      h("div", { class: "gloss-letter" }, letter),
      h("div", { class: "sign-grid" + (cat.value === "fingerspelling" ? " compact" : "") }, list.map(([k, s]) => {
        const grade = progress.signs[k]?.grade || "";
        const lessonLinks = s.lessons.map((id) => {
          const l = lessons.find((x) => x.id === id);
          return l ? h("a", { href: `lessons/${l.slug}.html` }, `Lesson ${id}`) : null;
        });
        return h("auslan-sign", { sign: k, compact: s.category === "fingerspelling" },
          h("p", {}, s.hint),
          h("p", { class: "muted", style: "font-size:.8rem;display:flex;gap:8px;align-items:center" },
            h("span", { class: "conf " + grade, title: grade || "not reviewed" }), ...lessonLinks));
      })),
    ]));
  }
  q.addEventListener("input", render);
  lessonSel.addEventListener("change", render);
  cat.addEventListener("change", render);
  render();
})();
</script>
</body>
</html>
