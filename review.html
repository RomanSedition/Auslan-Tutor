<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review — Auslan Tutor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤟</text></svg>">
  <link rel="stylesheet" href="assets/app.css?v=76e9c4d1e4">
</head>
<body>
<main class="wrap">
  <section class="hero" style="padding-bottom:0">
    <h1>Review</h1>
    <p>Spaced repetition: signs you find hard come back sooner, and signs you know drift further apart.</p>
  </section>

  <div class="toolbar">
    <select id="mode" title="Direction">
      <option value="see">👀 Sign → meaning</option>
      <option value="do">✋ Meaning → sign it (with mirror)</option>
      <option value="quiz">🎯 Multiple choice (completed lessons)</option>
      <option value="spell">🔤 Fingerspelling game</option>
    </select>
    <select id="deck" title="Deck">
      <option value="vocab">Vocabulary</option>
      <option value="fingerspelling">Fingerspelling letters</option>
      <option value="">Everything</option>
    </select>
    <select id="lesson"><option value="done">✓ Completed lessons</option><option value="">All lessons</option></select>
    <span class="muted" id="counts"></span>
  </div>

  <div id="card"></div>
  <p class="muted" id="keys" style="text-align:center;margin-top:16px">Keys: <kbd>Space</kbd> show answer · <kbd>1</kbd> again · <kbd>2</kbd> hard · <kbd>3</kbd> good · <kbd>M</kbd> mirror</p>
</main>

<script src="assets/app.js?v=d7f59d1d9d"></script>
<script>
(async () => {
  const { h, loadLessons, loadSigns, progress, saveProgress, store, Mirror } = AuslanTutor;
  const [lessons, signs] = await Promise.all([loadLessons(), loadSigns()]);
  const modeSel = document.getElementById("mode"), deckSel = document.getElementById("deck"), lessonSel = document.getElementById("lesson");
  lessons.forEach((l) => lessonSel.append(h("option", { value: l.id }, `${l.id}. ${l.title}`)));
  modeSel.value = store.get("auslan.review.mode", "see");
  lessonSel.value = store.get("auslan.review.lesson", "done");
  deckSel.value = store.get("auslan.review.deck", "vocab");

  // Leitner-style boxes → interval until next review.
  const MIN = 60e3, DAY = 864e5;
  const INTERVALS = [1 * MIN, 10 * MIN, 1 * DAY, 3 * DAY, 7 * DAY, 16 * DAY, 35 * DAY];

  let current = null, revealed = false, practiceAnyway = false;

  const completedIds = () => lessons.filter((l) => progress.lessons[l.id]).map((l) => l.id);
  const inScope = (k) => {
    const v = lessonSel.value;
    if (!v) return true;
    if (v === "done") return signs[k].lessons.some((id) => progress.lessons[id]);
    return signs[k].lessons.includes(+v);
  };
  const deck = () => Object.keys(signs).filter((k) =>
    (!deckSel.value || signs[k].category === deckSel.value) && inScope(k));

  function pick() {
    const now = Date.now();
    const keys = deck();
    const due = keys.filter((k) => progress.signs[k] && progress.signs[k].due <= now);
    const fresh = keys.filter((k) => !progress.signs[k]);
    document.getElementById("counts").textContent = `${due.length} due · ${fresh.length} new · ${keys.length} total`;
    const pool = due.length ? due : fresh.length ? fresh : practiceAnyway ? keys : [];
    const choices = pool.filter((k) => k !== current);
    return (choices.length ? choices : pool)[Math.floor(Math.random() * (choices.length || pool.length))] || null;
  }

  function record(key, g) {
    const p = progress.signs[key] || { box: 0 };
    p.box = g === "again" ? 0 : g === "hard" ? Math.max(1, p.box) : Math.min(p.box + 1, INTERVALS.length - 1);
    p.due = Date.now() + (g === "hard" ? INTERVALS[p.box] / 2 : INTERVALS[p.box]);
    p.grade = g;
    p.seen = Date.now();
    progress.signs[key] = p;
    saveProgress();
  }

  function grade(g) {
    if (!current || !revealed) return;
    record(current, g);
    next();
  }

  function videoEl(s, autoplay) {
    const v = h("video", { muted: true, loop: true, playsInline: true, autoplay, poster: s.poster, src: s.video });
    return h("div", { class: "sign-video-wrap playing", onclick: () => (v.paused ? v.play() : v.pause()) }, v);
  }

  // Words for the fingerspelling game: everyday short words, Aussie places and names,
  // plus the English for every single-word sign you've learned so far.
  const SPELL_WORDS = [
    "cat", "dog", "sun", "bus", "cup", "hat", "red", "bed", "map", "box", "fox", "zoo", "van", "jam", "key",
    "egg", "owl", "yes", "tea", "pie", "kiwi", "emu", "roo", "surf", "beach", "mate", "pub", "car", "wet", "joy",
    "milk", "cake", "fish", "frog", "rain", "wind", "home", "work", "book", "door", "park", "shop", "taxi", "quiz",
    "perth", "hobart", "darwin", "sydney", "cairns", "uluru", "bondi",
    "anna", "ben", "kate", "sam", "tom", "lucy", "jack", "mia", "zoe", "max",
  ];
  const spellWords = () => [...new Set([...SPELL_WORDS,
    ...Object.values(signs).filter((s) => s.category === "vocab")
      .flatMap((s) => s.english.split(/[,;]/)).map((w) => w.trim().toLowerCase())
      .filter((w) => /^[a-z]{2,8}$/.test(w))])];

  function next() {
    const spell = modeSel.value === "spell";
    deckSel.hidden = lessonSel.hidden = document.getElementById("counts").hidden = document.getElementById("keys").hidden = spell;
    if (spell) {
      current = null;
      document.getElementById("card").replaceChildren(
        h("fingerspell-drill", { words: spellWords().join(","), bank: "data/spelling-words.json", autofocus: true }),
        h("p", { class: "muted", style: "text-align:center" }, "Tip: start at 0.75× and work up to 1.25×. Fluent signers spell fast!"));
      return;
    }
    document.getElementById("keys").innerHTML = modeSel.value === "quiz"
      ? "Keys: <kbd>1</kbd>–<kbd>4</kbd> answer · <kbd>R</kbd> replay · <kbd>S</kbd> slow · <kbd>Enter</kbd> next"
      : "Keys: <kbd>Space</kbd> show answer · <kbd>1</kbd> again · <kbd>2</kbd> hard · <kbd>3</kbd> good · <kbd>M</kbd> mirror";
    if (modeSel.value === "quiz") return nextQuiz();
    current = pick();
    revealed = false;
    const box = document.getElementById("card");
    if (!current && lessonSel.value === "done" && !completedIds().length) {
      box.replaceChildren(h("div", { class: "review-card" }, h("div", { class: "empty" },
        h("p", { style: "font-size:2rem;margin:0" }, "📚"),
        h("p", {}, "No lessons marked complete yet. Press “Mark lesson complete” at the top of a lesson when you've finished it."),
        h("button", { class: "btn", onclick: () => { lessonSel.value = ""; lessonSel.dispatchEvent(new Event("change")); } }, "Use all lessons for now"))));
      return;
    }
    if (!current) {
      const upcoming = deck().map((k) => progress.signs[k]?.due).filter(Boolean).sort((a, b) => a - b)[0];
      const when = upcoming ? new Date(upcoming).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) : null;
      box.replaceChildren(h("div", { class: "review-card" }, h("div", { class: "empty" },
        h("p", { style: "font-size:2rem;margin:0" }, "🎉"),
        h("p", {}, "All caught up on this deck.", when ? ` Next review due ${when}.` : ""),
        h("button", { class: "btn", onclick: () => { practiceAnyway = true; next(); } }, "Practise anyway"))));
      return;
    }
    const s = signs[current];
    const mode = modeSel.value;
    const answer = h("div", { class: "answer", hidden: true });
    const grades = h("div", { class: "grades", hidden: true },
      h("button", { class: "btn grade-again", onclick: () => grade("again") }, "Again"),
      h("button", { class: "btn grade-hard", onclick: () => grade("hard") }, "Hard"),
      h("button", { class: "btn grade-good", onclick: () => grade("good") }, "Good"));
    const showBtn = h("button", { class: "btn primary", style: "margin:0 auto 18px;display:flex", onclick: reveal }, "Show answer");

    let top;
    if (mode === "see") {
      top = [videoEl(s, true), h("div", { class: "prompt muted" }, "What does this sign mean?")];
      answer.append(h("div", { class: "big", style: "font: 800 1.6rem var(--font-display)" }, s.label),
        h("p", { class: "muted", style: "margin:.2em 0" }, s.english), h("p", { style: "margin:0" }, s.hint));
    } else {
      top = [h("div", { class: "prompt" },
        h("div", { class: "muted" }, s.category === "fingerspelling" ? "Fingerspell the letter" : "Sign this:"),
        h("div", { class: "big" }, s.category === "fingerspelling" ? s.label : s.english),
        h("button", { class: "btn small", style: "margin-top:10px", onclick: () => Mirror.open() }, "🪞 Open mirror"))];
      answer.append(videoEl(s, true), h("p", {}, h("b", {}, s.label), " — ", s.hint));
    }
    box.replaceChildren(h("div", { class: "review-card" }, ...top, showBtn, answer, grades));

    function reveal() {
      revealed = true;
      showBtn.hidden = true;
      answer.hidden = false;
      grades.hidden = false;
      if (mode === "do") Mirror.setReference({ label: s.label, video: s.video });
    }
    box.reveal = reveal;
  }


  /* ---------- 🎯 Multiple choice ---------- */
  const quizScore = { right: 0, total: 0, streak: 0, best: store.get("auslan.quiz.best", 0) };
  let quiz = null; // { key, answered, firstTry, buttons, video, choose(i), next() }
  const recent = [];

  // Every video a sign can show (its current one plus regional versions).
  const videosOf = (k) => new Set([signs[k].video, ...(signs[k].variants || []).map((v) => v.video)]);

  function pickQuiz(pool) {
    const now = Date.now();
    const notRecent = pool.filter((k) => !recent.includes(k));
    const src = notRecent.length ? notRecent : pool;
    // Favour signs that are due or weak, then unseen ones, then anything.
    const due = src.filter((k) => progress.signs[k]?.due <= now || progress.signs[k]?.grade === "again");
    const fresh = src.filter((k) => !progress.signs[k]);
    const r = Math.random();
    const from = due.length && r < 0.6 ? due : fresh.length && r < 0.85 ? fresh : src;
    return from[Math.floor(Math.random() * from.length)];
  }

  function distractors(key, pool) {
    const mine = videosOf(key);
    const ok = (k) => k !== key && signs[k].label !== signs[key].label &&
      ![...videosOf(k)].some((v) => mine.has(v)); // never offer a sign that looks identical
    const sameCat = (k) => signs[k].category === signs[key].category;
    let cands = pool.filter(ok);
    if (cands.length < 3) cands = Object.keys(signs).filter((k) => ok(k) && sameCat(k)); // top up from all signs
    return AuslanTutor.shuffle(cands).slice(0, 3);
  }

  function nextQuiz() {
    current = null;
    const box = document.getElementById("card");
    const pool = deck();
    const counts = document.getElementById("counts");
    counts.textContent = `${pool.length} signs in play`;
    if (lessonSel.value === "done" && !completedIds().length) {
      box.replaceChildren(h("div", { class: "review-card" }, h("div", { class: "empty" },
        h("p", { style: "font-size:2rem;margin:0" }, "📚"),
        h("p", {}, "No lessons marked complete yet. Press “Mark lesson complete” at the top of a lesson when you've finished it, and its signs will show up here."),
        h("button", { class: "btn", onclick: () => { lessonSel.value = ""; lessonSel.dispatchEvent(new Event("change")); } }, "Use all lessons for now"))));
      return;
    }
    if (pool.length < 2) {
      box.replaceChildren(h("div", { class: "review-card" }, h("div", { class: "empty" },
        h("p", {}, "Not enough signs in this selection. Try “Everything” or another lesson."))));
      return;
    }

    const key = pickQuiz(pool);
    recent.push(key); if (recent.length > Math.min(8, pool.length - 1)) recent.shift();
    const s = signs[key];
    const opts = AuslanTutor.shuffle([key, ...distractors(key, pool)]);

    const v = h("video", { muted: true, loop: true, playsInline: true, autoplay: true, poster: s.poster || null, src: s.video });
    const wrap = h("div", { class: "sign-video-wrap playing", onclick: () => (v.paused ? v.play() : v.pause()) }, v);
    const slow = h("button", { class: "chip", onclick: () => toggleSlow() }, "0.5×");
    const toggleSlow = () => { v.playbackRate = v.playbackRate === 1 ? 0.5 : 1; slow.classList.toggle("on", v.playbackRate !== 1); v.play().catch(() => {}); };
    const feedback = h("div", { class: "quiz-feedback", style: "text-align:center;min-height:3.2em" });
    const scoreEl = h("p", { class: "muted", style: "text-align:center;margin:0 0 14px;font-size:.9rem" });
    const renderScore = () => {
      scoreEl.textContent = quizScore.total
        ? `Score ${quizScore.right}/${quizScore.total} · streak ${quizScore.streak} · best ${quizScore.best}`
        : `Best streak: ${quizScore.best}`;
    };
    const nextBtn = h("button", { class: "btn primary", hidden: true, style: "margin:0 auto 18px;display:flex", onclick: () => nextQuiz() }, "Next ", h("kbd", {}, "↵"));

    const q = { key, answered: false, firstTry: true };
    const buttons = opts.map((k, i) => h("button", { onclick: () => choose(i) },
      h("kbd", { style: "margin-right:8px;opacity:.6" }, String(i + 1)), signs[k].label));

    function choose(i) {
      if (q.answered) return;
      const k = opts[i];
      if (k === key) {
        q.answered = true;
        buttons[i].classList.add("right");
        quizScore.total++;
        if (q.firstTry) {
          quizScore.right++; quizScore.streak++;
          if (quizScore.streak > quizScore.best) { quizScore.best = quizScore.streak; store.set("auslan.quiz.best", quizScore.best); }
          record(key, "good");
        } else {
          quizScore.streak = 0;
          record(key, "again");
        }
        feedback.replaceChildren(h("b", {}, `✓ ${s.label}`), ` — ${s.english}`, h("br"), h("span", { class: "muted" }, s.hint));
        nextBtn.hidden = false;
        renderScore();
      } else {
        q.firstTry = false;
        buttons[i].classList.add("wrong");
        feedback.textContent = `Not ${signs[k].label}. Watch again (try 0.5×).`;
      }
    }

    quiz = { choose, replay: () => { v.currentTime = 0; v.play().catch(() => {}); }, toggleSlow,
             next: () => q.answered && nextQuiz(), isAnswered: () => q.answered, count: opts.length };
    renderScore();
    box.replaceChildren(h("div", { class: "review-card" },
      h("div", { class: "q", style: "padding:10px 14px;font-weight:600;color:var(--muted)" }, "Which sign is this? ", slow),
      wrap, h("div", { class: "quiz-options" }, buttons), feedback, nextBtn, scoreEl));
  }

  document.addEventListener("keydown", (e) => {
    if (e.target.closest?.("input, select, textarea") || e.metaKey || e.ctrlKey) return;
    if (modeSel.value === "quiz") {
      if (!quiz) return;
      const n = Number(e.key);
      if (n >= 1 && n <= quiz.count) quiz.choose(n - 1);
      else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); quiz.next(); }
      else if (e.key === "r" || e.key === "R") quiz.replay();
      else if (e.key === "s" || e.key === "S") quiz.toggleSlow();
      return;
    }
    if (modeSel.value === "spell") return;
    if (e.key === " " && !revealed) { e.preventDefault(); document.getElementById("card").reveal?.(); }
    else if (e.key === "1") grade("again");
    else if (e.key === "2") grade("hard");
    else if (e.key === "3") grade("good");
  });
  for (const el of [modeSel, deckSel, lessonSel]) el.addEventListener("change", () => {
    store.set("auslan.review.mode", modeSel.value);
    store.set("auslan.review.deck", deckSel.value);
    store.set("auslan.review.lesson", lessonSel.value);
    practiceAnyway = false;
    next();
  });
  next();
})();
</script>
</body>
</html>
