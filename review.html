<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review — Auslan Tutor</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤟</text></svg>">
  <link rel="stylesheet" href="assets/app.css?v=bfe8546879">
  <style>
  /* 🧩 Match pairs: a 2×2 board of small looping videos, then the shuffled labels. */
  .match-videos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 10px 0; }
  .match-videos .sign-video-wrap { border-radius: 10px; overflow: hidden; outline: 3px solid transparent; outline-offset: -3px; }
  .match-videos .sign-video-wrap.sel { outline-color: var(--accent); }
  .match-videos .sign-video-wrap.right { outline-color: var(--good); cursor: default; }
  .match-videos .sign-video-wrap.wrong { animation: match-wrong .6s; }
  .match-videos .match-tag {
    position: absolute; left: 6px; bottom: 6px; padding: 2px 8px; border-radius: 8px;
    background: var(--good); color: #fff; font: 700 .8rem var(--font);
  }
  .quiz-options button.sel { border-color: var(--accent); background: var(--accent-soft); }
  .quiz-options button:disabled { cursor: default; text-decoration: none; }
  .quiz-options button.wrong-flash { animation: match-wrong .6s; }
  /* 🧱 Phrase builder: tap sign tiles in the order they were signed. */
  .phrase-game .fs-stage { margin: 10px; border-radius: 10px; }
  .phrase-row { display: flex; flex-wrap: wrap; gap: 6px; min-height: 48px; padding: 8px 10px; margin: 0 10px;
    border: 2px dashed var(--border); border-radius: 12px; align-items: center; }
  .phrase-row.bank { border-style: solid; border-color: transparent; background: var(--surface-2); margin-top: 8px; }
  .phrase-row .slot-hint { color: var(--muted); font-size: .85rem; }
  .ptile { font: 700 .95rem var(--font-display); letter-spacing: .03em; padding: 9px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }
  .ptile:hover { border-color: var(--accent); }
  .ptile.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 18%, var(--surface)); }
  .ptile.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
  .ptile.now { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .phrase-tools { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 12px 10px 4px; }
  .phrase-tools select { font: 600 .85rem var(--font); padding: 6px 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); }
  @keyframes match-wrong {
    0%, 60% { outline-color: var(--bad); border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--surface)); }
  }
  </style>
</head>
<body>
<main class="wrap">
  <section class="hero" style="padding-bottom:0">
    <h1>Review</h1>
    <p>Spaced repetition: signs you find hard come back sooner, and signs you know drift further apart.</p>
  </section>

  <div class="toolbar">
    <select id="mode" title="Direction">
      <option value="see">👀 Sign → meaning</option>
      <option value="do">✋ Meaning → sign it (with mirror)</option>
      <option value="quiz">🎯 Multiple choice (completed lessons)</option>
      <option value="match">🧩 Match pairs</option>
      <option value="phrase">🧱 Phrase builder</option>
      <option value="spell">🔤 Fingerspelling game</option>
    </select>
    <select id="deck" title="Deck">
      <option value="vocab">Vocabulary</option>
      <option value="fingerspelling">Fingerspelling letters</option>
      <option value="">Everything</option>
    </select>
    <select id="lesson"><option value="done">✓ Completed lessons</option><option value="">All lessons</option></select>
    <span class="muted" id="counts"></span>
  </div>

  <div id="card"></div>
  <p class="muted" id="keys" style="text-align:center;margin-top:16px">Keys: <kbd>Space</kbd> show answer · <kbd>1</kbd> again · <kbd>2</kbd> hard · <kbd>3</kbd> good · <kbd>M</kbd> mirror</p>
</main>

<script src="assets/app.js?v=ccbb81a6bf"></script>
<script>
(async () => {
  const { h, loadLessons, loadSigns, progress, saveProgress, store, Mirror } = AuslanTutor;
  const [lessons, signs] = await Promise.all([loadLessons(), loadSigns()]);
  const modeSel = document.getElementById("mode"), deckSel = document.getElementById("deck"), lessonSel = document.getElementById("lesson");
  lessons.forEach((l) => lessonSel.append(h("option", { value: l.id }, `${l.id}. ${l.title}`)));
  modeSel.value = store.get("auslan.review.mode", "see");
  lessonSel.value = store.get("auslan.review.lesson", "done");
  deckSel.value = store.get("auslan.review.deck", "vocab");

  // Leitner-style boxes → interval until next review.
  const MIN = 60e3, DAY = 864e5;
  const INTERVALS = [1 * MIN, 10 * MIN, 1 * DAY, 3 * DAY, 7 * DAY, 16 * DAY, 35 * DAY];

  let current = null, revealed = false, practiceAnyway = false;

  const completedIds = () => lessons.filter((l) => progress.lessons[l.id]).map((l) => l.id);
  const inScope = (k) => {
    const v = lessonSel.value;
    if (!v) return true;
    if (v === "done") return signs[k].lessons.some((id) => progress.lessons[id]);
    return signs[k].lessons.includes(+v);
  };
  const deck = () => Object.keys(signs).filter((k) =>
    (!deckSel.value || signs[k].category === deckSel.value) && inScope(k));

  function pick() {
    const now = Date.now();
    const keys = deck();
    const due = keys.filter((k) => progress.signs[k] && progress.signs[k].due <= now);
    const fresh = keys.filter((k) => !progress.signs[k]);
    document.getElementById("counts").textContent = `${due.length} due · ${fresh.length} new · ${keys.length} total`;
    const pool = due.length ? due : fresh.length ? fresh : practiceAnyway ? keys : [];
    const choices = pool.filter((k) => k !== current);
    return (choices.length ? choices : pool)[Math.floor(Math.random() * (choices.length || pool.length))] || null;
  }

  function record(key, g) {
    const p = progress.signs[key] || { box: 0 };
    p.box = g === "again" ? 0 : g === "hard" ? Math.max(1, p.box) : Math.min(p.box + 1, INTERVALS.length - 1);
    p.due = Date.now() + (g === "hard" ? INTERVALS[p.box] / 2 : INTERVALS[p.box]);
    p.grade = g;
    p.seen = Date.now();
    progress.signs[key] = p;
    saveProgress();
  }

  function grade(g) {
    if (!current || !revealed) return;
    record(current, g);
    next();
  }

  function videoEl(s, autoplay) {
    const v = h("video", { muted: true, loop: true, playsInline: true, autoplay, poster: s.poster, src: s.video });
    return h("div", { class: "sign-video-wrap playing", onclick: () => (v.paused ? v.play() : v.pause()) }, v);
  }

  // Words for the fingerspelling game: everyday short words, Aussie places and names,
  // plus the English for every single-word sign you've learned so far.
  const SPELL_WORDS = [
    "cat", "dog", "sun", "bus", "cup", "hat", "red", "bed", "map", "box", "fox", "zoo", "van", "jam", "key",
    "egg", "owl", "yes", "tea", "pie", "kiwi", "emu", "roo", "surf", "beach", "mate", "pub", "car", "wet", "joy",
    "milk", "cake", "fish", "frog", "rain", "wind", "home", "work", "book", "door", "park", "shop", "taxi", "quiz",
    "perth", "hobart", "darwin", "sydney", "cairns", "uluru", "bondi",
    "anna", "ben", "kate", "sam", "tom", "lucy", "jack", "mia", "zoe", "max",
  ];
  const spellWords = () => [...new Set([...SPELL_WORDS,
    ...Object.values(signs).filter((s) => s.category === "vocab")
      .flatMap((s) => s.english.split(/[,;]/)).map((w) => w.trim().toLowerCase())
      .filter((w) => /^[a-z]{2,8}$/.test(w))])];

  function next() {
    const spell = modeSel.value === "spell";
    deckSel.hidden = lessonSel.hidden = document.getElementById("counts").hidden = document.getElementById("keys").hidden = spell;
    if (!spell) deckSel.hidden = modeSel.value === "phrase";
    if (spell) {
      current = null;
      document.getElementById("card").replaceChildren(
        h("fingerspell-drill", { words: spellWords().join(","), bank: "data/spelling-words.json", autofocus: true }),
        h("p", { class: "muted", style: "text-align:center" }, "Tip: start at 0.75× and work up to 1.25×. Fluent signers spell fast!"));
      return;
    }
    document.getElementById("keys").innerHTML = modeSel.value === "quiz"
      ? "Keys: <kbd>1</kbd>–<kbd>4</kbd> answer · <kbd>R</kbd> replay · <kbd>S</kbd> slow · <kbd>Enter</kbd> next"
      : modeSel.value === "match"
      ? "Tap a video, then the label that matches it · <kbd>Enter</kbd> next round"
      : modeSel.value === "phrase"
      ? "Keys: <kbd>Space</kbd> replay · <kbd>⌫</kbd> undo · <kbd>Enter</kbd> check / next"
      : "Keys: <kbd>Space</kbd> show answer · <kbd>1</kbd> again · <kbd>2</kbd> hard · <kbd>3</kbd> good · <kbd>M</kbd> mirror";
    if (modeSel.value === "quiz") return nextQuiz();
    if (modeSel.value === "match") return nextMatch();
    if (modeSel.value === "phrase") return nextPhrase();
    current = pick();
    revealed = false;
    const box = document.getElementById("card");
    if (!current && lessonSel.value === "done" && !completedIds().length) {
      box.replaceChildren(h("div", { class: "review-card" }, h("div", { class: "empty" },
        h("p", { style: "font-size:2rem;margin:0" }, "📚"),
        h("p", {}, "No lessons marked complete yet. Press “Mark lesson complete” at the top of a lesson when you've finished it."),
        h("button", { class: "btn", onclick: () => { lessonSel.value = ""; lessonSel.dispatchEvent(new Event("change")); } }, "Use all lessons for now"))));
      return;
    }
    if (!current) {
      const upcoming = deck().map((k) => progress.signs[k]?.due).filter(Boolean).sort((a, b) => a - b)[0];
      const when = upcoming ? new Date(upcoming).toLocaleString([], { weekday: "short", hour: "numeric", minute: "2-digit" }) : null;
      box.replaceChildren(h("div", { class: "review-card" }, h("div", { class: "empty" },
        h("p", { style: "font-size:2rem;margin:0" }, "🎉"),
        h("p", {}, "All caught up on this deck.", when ? ` Next review due ${when}.` : ""),
        h("button", { class: "btn", onclick: () => { practiceAnyway = true; next(); } }, "Practise anyway"))));
      return;
    }
    const s = signs[current];
    const mode = modeSel.value;
    const answer = h("div", { class: "answer", hidden: true });
    const grades = h("div", { class: "grades", hidden: true },
      h("button", { class: "btn grade-again", onclick: () => grade("again") }, "Again"),
      h("button", { class: "btn grade-hard", onclick: () => grade("hard") }, "Hard"),
      h("button", { class: "btn grade-good", onclick: () => grade("good") }, "Good"));
    const showBtn = h("button", { class: "btn primary", style: "margin:0 auto 18px;display:flex", onclick: reveal }, "Show answer");

    let top;
    if (mode === "see") {
      top = [videoEl(s, true), h("div", { class: "prompt muted" }, "What does this sign mean?")];
      answer.append(h("div", { class: "big", style: "font: 800 1.6rem var(--font-display)" }, s.label),
        h("p", { class: "muted", style: "margin:.2em 0" }, s.english), h("p", { style: "margin:0" }, s.hint));
    } else {
      top = [h("div", { class: "prompt" },
        h("div", { class: "muted" }, s.category === "fingerspelling" ? "Fingerspell the letter" : "Sign this:"),
        h("div", { class: "big" }, s.category === "fingerspelling" ? s.label : s.english),
        h("button", { class: "btn small", style: "margin-top:10px", onclick: () => Mirror.open() }, "🪞 Open mirror"))];
      answer.append(videoEl(s, true), h("p", {}, h("b", {}, s.label), " — ", s.hint));
    }
    box.replaceChildren(h("div", { class: "review-card" }, ...top, showBtn, answer, grades));

    function reveal() {
      revealed = true;
      showBtn.hidden = true;
      answer.hidden = false;
      grades.hidden = false;
      if (mode === "do") Mirror.setReference({ label: s.label, video: s.video });
    }
    box.reveal = reveal;
  }


  /* ---------- 🎯 Multiple choice ---------- */
  const quizScore = { right: 0, total: 0, streak: 0, best: store.get("auslan.quiz.best", 0) };
  let quiz = null; // { key, answered, firstTry, buttons, video, choose(i), next() }
  const recent = [];

  // Every video a sign can show (its current one plus regional versions).
  const videosOf = (k) => new Set([signs[k].video, ...(signs[k].variants || []).map((v) => v.video)]);

  function pickQuiz(pool) {
    const now = Date.now();
    const notRecent = pool.filter((k) => !recent.includes(k));
    const src = notRecent.length ? notRecent : pool;
    // Favour signs that are due or weak, then unseen ones, then anything.
    const due = src.filter((k) => progress.signs[k]?.due <= now || progress.signs[k]?.grade === "again");
    const fresh = src.filter((k) => !progress.signs[k]);
    const r = Math.random();
    const from = due.length && r < 0.6 ? due : fresh.length && r < 0.85 ? fresh : src;
    return from[Math.floor(Math.random() * from.length)];
  }

  function distractors(key, pool) {
    const mine = videosOf(key);
    const ok = (k) => k !== key && signs[k].label !== signs[key].label &&
      ![...videosOf(k)].some((v) => mine.has(v)); // never offer a sign that looks identical
    const sameCat = (k) => signs[k].category === signs[key].category;
    let cands = pool.filter(ok);
    if (cands.length < 3) cands = Object.keys(signs).filter((k) => ok(k) && sameCat(k)); // top up from all signs
    return AuslanTutor.shuffle(cands).slice(0, 3);
  }

  // Shown by the game modes when the selection can't make a question.
  function gameEmpty(box, pool) {
    if (lessonSel.value === "done" && !completedIds().length) {
      box.replaceChildren(h("div", { class: "review-card" }, h("div", { class: "empty" },
        h("p", { style: "font-size:2rem;margin:0" }, "📚"),
        h("p", {}, "No lessons marked complete yet. Press “Mark lesson complete” at the top of a lesson when you've finished it, and its signs will show up here."),
        h("button", { class: "btn", onclick: () => { lessonSel.value = ""; lessonSel.dispatchEvent(new Event("change")); } }, "Use all lessons for now"))));
      return true;
    }
    if (pool.length < 2) {
      box.replaceChildren(h("div", { class: "review-card" }, h("div", { class: "empty" },
        h("p", {}, "Not enough signs in this selection. Try “Everything” or another lesson."))));
      return true;
    }
    return false;
  }

  function nextQuiz() {
    current = null;
    const box = document.getElementById("card");
    const pool = deck();
    const counts = document.getElementById("counts");
    counts.textContent = `${pool.length} signs in play`;
    if (gameEmpty(box, pool)) return;

    const key = pickQuiz(pool);
    recent.push(key); if (recent.length > Math.min(8, pool.length - 1)) recent.shift();
    const s = signs[key];
    const opts = AuslanTutor.shuffle([key, ...distractors(key, pool)]);

    const v = h("video", { muted: true, loop: true, playsInline: true, autoplay: true, poster: s.poster || null, src: s.video });
    const wrap = h("div", { class: "sign-video-wrap playing", onclick: () => (v.paused ? v.play() : v.pause()) }, v);
    const slow = h("button", { class: "chip", onclick: () => toggleSlow() }, "0.5×");
    const toggleSlow = () => { v.playbackRate = v.playbackRate === 1 ? 0.5 : 1; slow.classList.toggle("on", v.playbackRate !== 1); v.play().catch(() => {}); };
    const feedback = h("div", { class: "quiz-feedback", style: "text-align:center;min-height:3.2em" });
    const scoreEl = h("p", { class: "muted", style: "text-align:center;margin:0 0 14px;font-size:.9rem" });
    const renderScore = () => {
      scoreEl.textContent = quizScore.total
        ? `Score ${quizScore.right}/${quizScore.total} · streak ${quizScore.streak} · best ${quizScore.best}`
        : `Best streak: ${quizScore.best}`;
    };
    const nextBtn = h("button", { class: "btn primary", hidden: true, style: "margin:0 auto 18px;display:flex", onclick: () => nextQuiz() }, "Next ", h("kbd", {}, "↵"));

    const q = { key, answered: false, firstTry: true };
    const buttons = opts.map((k, i) => h("button", { onclick: () => choose(i) },
      h("kbd", { style: "margin-right:8px;opacity:.6" }, String(i + 1)), signs[k].label));

    function choose(i) {
      if (q.answered) return;
      const k = opts[i];
      if (k === key) {
        q.answered = true;
        buttons[i].classList.add("right");
        quizScore.total++;
        if (q.firstTry) {
          quizScore.right++; quizScore.streak++;
          if (quizScore.streak > quizScore.best) { quizScore.best = quizScore.streak; store.set("auslan.quiz.best", quizScore.best); }
          record(key, "good");
        } else {
          quizScore.streak = 0;
          record(key, "again");
        }
        feedback.replaceChildren(h("b", {}, `✓ ${s.label}`), ` — ${s.english}`, h("br"), h("span", { class: "muted" }, s.hint));
        nextBtn.hidden = false;
        renderScore();
      } else {
        q.firstTry = false;
        buttons[i].classList.add("wrong");
        feedback.textContent = `Not ${signs[k].label}. Watch again (try 0.5×).`;
      }
    }

    quiz = { choose, replay: () => { v.currentTime = 0; v.play().catch(() => {}); }, toggleSlow,
             next: () => q.answered && nextQuiz(), isAnswered: () => q.answered, count: opts.length };
    renderScore();
    box.replaceChildren(h("div", { class: "review-card" },
      h("div", { class: "q", style: "padding:10px 14px;font-weight:600;color:var(--muted)" }, "Which sign is this? ", slow),
      wrap, h("div", { class: "quiz-options" }, buttons), feedback, nextBtn, scoreEl));
  }


  /* ---------- 🧩 Match pairs ---------- */
  const MATCH_PAIRS = 4;
  let match = null; // { done(), next() }

  // Up to 4 signs where no two share a label or any video (GREY and Southern PURPLE do).
  function pickBoard(pool) {
    const board = [];
    const clash = (k) => board.some((b) => k === b || signs[k].label === signs[b].label ||
      [...videosOf(k)].some((v) => videosOf(b).has(v)));
    const fill = (src) => {
      while (board.length < MATCH_PAIRS) {
        const cands = src.filter((k) => !clash(k));
        if (!cands.length) break;
        const k = pickQuiz(cands);
        board.push(k);
        recent.push(k); if (recent.length > 8) recent.shift();
      }
    };
    fill(pool);
    // A small lesson can't fill the board alone: top up from the same deck in every lesson.
    if (board.length < MATCH_PAIRS) fill(Object.keys(signs).filter((k) => !deckSel.value || signs[k].category === deckSel.value));
    return board;
  }

  function nextMatch() {
    current = null;
    const box = document.getElementById("card");
    const pool = deck();
    document.getElementById("counts").textContent = `${pool.length} signs in play`;
    if (gameEmpty(box, pool)) return;

    const board = AuslanTutor.shuffle(pickBoard(pool));
    if (board.length < 2) return gameEmpty(box, []);
    const labels = AuslanTutor.shuffle(board);
    const missed = new Set(); // signs whose video was paired wrongly this round
    const matched = new Set();
    let selVideo = null, selLabel = null, started = performance.now();
    let best = store.get("auslan.match.best", 0);

    const flash = (el, cls) => { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); };
    const status = h("div", { class: "quiz-feedback", style: "text-align:center;min-height:3.2em;padding:0 14px" },
      h("span", { class: "muted" }, best ? `Best time: ${(best / 1000).toFixed(1)}s` : "Match each sign to its meaning."));
    const nextBtn = h("button", { class: "btn primary", hidden: true, style: "margin:0 auto 18px;display:flex", onclick: () => nextMatch() }, "Next round ", h("kbd", {}, "↵"));

    const tiles = board.map((k) => {
      const v = h("video", { muted: true, loop: true, playsInline: true, autoplay: true, preload: "auto", poster: signs[k].poster || null, src: signs[k].video });
      return h("div", { class: "sign-video-wrap playing", role: "button", tabindex: 0, "aria-label": "Sign video", onclick: () => pickVideo(k),
        onkeydown: (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); e.stopPropagation(); pickVideo(k); } } }, v);
    });
    const buttons = labels.map((k) => h("button", { onclick: () => pickLabel(k) }, signs[k].label));
    const tileOf = (k) => tiles[board.indexOf(k)], buttonOf = (k) => buttons[labels.indexOf(k)];

    function pickVideo(k) {
      if (matched.has(k)) return;
      if (selVideo) tileOf(selVideo).classList.remove("sel");
      selVideo = selVideo === k ? null : k;
      if (selVideo) tileOf(k).classList.add("sel");
      tryPair();
    }
    function pickLabel(k) {
      if (matched.has(k)) return;
      if (selLabel) buttonOf(selLabel).classList.remove("sel");
      selLabel = selLabel === k ? null : k;
      if (selLabel) buttonOf(k).classList.add("sel");
      tryPair();
    }
    function tryPair() {
      if (!selVideo || !selLabel) return;
      const v = selVideo, l = selLabel, tile = tileOf(v), btn = buttonOf(l);
      selVideo = selLabel = null;
      tile.classList.remove("sel"); btn.classList.remove("sel");
      if (v === l) {
        matched.add(v);
        tile.classList.add("right"); btn.classList.add("right"); btn.disabled = true;
        tile.append(h("span", { class: "match-tag" }, signs[v].label));
        if (!missed.has(v)) record(v, "good");
        status.replaceChildren(h("b", {}, `✓ ${signs[v].label}`), ` — ${signs[v].english}`);
        if (matched.size === board.length) finish();
      } else {
        flash(tile, "wrong"); flash(btn, "wrong-flash");
        if (!missed.has(v)) { missed.add(v); record(v, "again"); }
        status.textContent = `Not ${signs[l].label}. Watch that one again.`;
      }
    }
    function finish() {
      const ms = performance.now() - started;
      const full = board.length === MATCH_PAIRS; // only full boards count towards the best time
      const isBest = full && (!best || ms < best);
      if (isBest) { best = ms; store.set("auslan.match.best", Math.round(ms)); }
      status.replaceChildren(h("b", {}, `🧩 All matched in ${(ms / 1000).toFixed(1)}s`),
        missed.size ? ` with ${missed.size} mistake${missed.size > 1 ? "s" : ""}` : " — no mistakes!", h("br"),
        h("span", { class: "muted" }, isBest ? "🏆 New best time!" : best ? `Best time: ${(best / 1000).toFixed(1)}s` : ""));
      nextBtn.hidden = false;
      nextBtn.focus({ preventScroll: true });
    }

    match = { done: () => matched.size === board.length, next: () => nextMatch() };
    box.replaceChildren(h("div", { class: "review-card" },
      h("div", { class: "q", style: "padding:10px 14px 0;font-weight:600;color:var(--muted)" }, "Tap a video, then its meaning."),
      h("div", { class: "match-videos" }, tiles), h("div", { class: "quiz-options" }, buttons), status, nextBtn));
  }


  /* ---------- 🧱 Phrase builder ---------- */
  // Watch a lesson phrase signed as one smooth sequence, then tap the sign tiles in the order you saw them.
  let phrasesP = null;
  const loadPhrases = () => (phrasesP ||= fetch(AuslanTutor.ROOT + "data/phrases.json", { cache: "no-cache" })
    .then((r) => (r.ok ? r.json() : [])).catch(() => []));
  const phraseScore = { right: 0, total: 0, streak: 0, best: store.get("auslan.phrase.best", 0) };
  const recentPhrases = [];
  let phraseGame = null;

  const phraseInScope = (ph) => {
    const v = lessonSel.value;
    if (!v) return true;
    if (v === "done") return !!progress.lessons[ph.lesson];
    return ph.lesson === +v;
  };

  async function nextPhrase() {
    current = null;
    phraseGame?.stop();
    const box = document.getElementById("card");
    const all = (await loadPhrases()).filter((ph) =>
      ph.signs.split(/\s+/).every((t) => t.startsWith("fs:") || signs[t]));
    const pool = all.filter(phraseInScope);
    document.getElementById("counts").textContent = `${pool.length} phrases in play`;
    if (lessonSel.value === "done" && !completedIds().length) return gameEmpty(box, []);
    if (!pool.length) {
      box.replaceChildren(h("div", { class: "review-card" }, h("div", { class: "empty" },
        h("p", {}, "No phrases in this selection yet. Try “All lessons”."))));
      return;
    }

    const fresh = pool.filter((ph) => !recentPhrases.includes(ph.id));
    const ph = (fresh.length ? fresh : pool)[Math.floor(Math.random() * (fresh.length || pool.length))];
    recentPhrases.push(ph.id); if (recentPhrases.length > Math.min(10, pool.length - 1)) recentPhrases.shift();

    const tokens = ph.signs.split(/\s+/);
    const { clips, labels } = AuslanTutor.phraseClips(tokens, signs);
    const name = AuslanTutor.userName() || AuslanTutor.FALLBACK_NAME;
    const english = ph.english.replaceAll("{name}", name), face = ph.face.replaceAll("{name}", name);

    // Decoys: signs from other phrases in play (so they're familiar), never one that looks the same.
    const phraseVideos = new Set(tokens.filter((t) => signs[t]).flatMap((t) => [...videosOf(t)]));
    const familiar = [...new Set(pool.flatMap((p) => p.signs.split(/\s+/)))];
    const decoyKeys = AuslanTutor.shuffle(familiar.filter((t) =>
      signs[t] && !labels.includes(signs[t].label) && ![...videosOf(t)].some((v) => phraseVideos.has(v))))
      .slice(0, tokens.length >= 6 ? 2 : 3);
    // Tiles: one per token, plus decoys. Duplicate labels (ME … ME) are separate tiles.
    const tiles = AuslanTutor.shuffle([...labels.map((l, i) => ({ label: l, id: "t" + i })),
      ...decoyKeys.map((k, i) => ({ label: signs[k].label, id: "d" + i }))]);

    let answer = [], done = false, firstTry = true, cancel = null;
    const stage = h("div", { class: "fs-stage phrase-stage" });
    const rate = h("select", { title: "Speed" }, [0.5, 0.75, 1].map((r) => h("option", { value: r, selected: r === store.get("auslan.phrase.rate", 0.75) }, `${r}×`)));
    rate.addEventListener("change", () => { store.set("auslan.phrase.rate", +rate.value); play(); });
    const answerRow = h("div", { class: "phrase-row", "aria-label": "Your answer" });
    const bankRow = h("div", { class: "phrase-row bank", "aria-label": "Sign tiles" });
    const feedback = h("div", { class: "quiz-feedback", style: "text-align:center;min-height:3.2em;padding:6px 14px 0" });
    const scoreEl = h("p", { class: "muted", style: "text-align:center;margin:4px 0 14px;font-size:.9rem" });
    const renderScore = () => {
      scoreEl.textContent = phraseScore.total
        ? `Score ${phraseScore.right}/${phraseScore.total} · streak ${phraseScore.streak} · best ${phraseScore.best}`
        : `Best streak: ${phraseScore.best}`;
    };

    const play = () => {
      cancel?.();
      // Highlight tiles as they're signed only once the answer is out (otherwise it gives the order away).
      const answerTiles = () => [...answerRow.querySelectorAll(".ptile")];
      cancel = AuslanTutor.playSequence(stage, clips, +rate.value, (i) => {
        if (!done) return;
        answerTiles().forEach((t, ti) => t.classList.toggle("now", i >= 0 && clips[i].ti === ti));
      });
    };

    function render() {
      answerRow.replaceChildren(...(answer.length ? answer.map((t, i) => h("button", {
        class: "ptile" + (t.state ? " " + t.state : ""), disabled: done,
        onclick: () => { if (done) return; answer.splice(i, 1); answer.forEach((a) => (a.state = "")); render(); },
      }, t.label)) : [h("span", { class: "slot-hint" }, `Tap the ${labels.length} signs in order…`)]));
      const used = new Set(answer.map((t) => t.id));
      bankRow.replaceChildren(...tiles.filter((t) => !used.has(t.id)).map((t) => h("button", {
        class: "ptile", disabled: done,
        onclick: () => { if (done) return; answer.push({ ...t, state: "" }); render(); },
      }, t.label)));
      bankRow.hidden = done;
    }

    function finish(won) {
      done = true;
      phraseScore.total++;
      if (won && firstTry) {
        phraseScore.right++; phraseScore.streak++;
        if (phraseScore.streak > phraseScore.best) { phraseScore.best = phraseScore.streak; store.set("auslan.phrase.best", phraseScore.best); }
      } else phraseScore.streak = 0;
      feedback.replaceChildren(h("b", {}, won ? (firstTry ? "✓ Spot on!" : "✓ Got it") : "Here's the phrase"),
        h("br"), `“${english}”`, face ? h("br") : "", face ? h("span", { class: "muted" }, `Face: ${face}`) : "");
      checkBtn.hidden = revealBtn.hidden = undoBtn.hidden = true;
      nextBtn.hidden = false;
      render(); renderScore();
      play(); // replay with the tiles lighting up in time
    }

    function check() {
      if (done) return;
      if (answer.length !== labels.length) {
        feedback.textContent = `Use ${labels.length} signs. You have ${answer.length}.`;
        return;
      }
      let ok = true;
      answer.forEach((t, i) => { t.state = t.label === labels[i] ? "right" : "wrong"; if (t.state === "wrong") ok = false; });
      if (ok) return finish(true);
      firstTry = false;
      feedback.textContent = "Not quite. Red tiles are in the wrong place. Replay and try again.";
      render();
    }
    function reveal() {
      if (done) return;
      answer = labels.map((l, i) => ({ label: l, id: "r" + i, state: "right" }));
      firstTry = false;
      finish(false);
    }
    const undo = () => { if (done || !answer.length) return; answer.pop(); answer.forEach((a) => (a.state = "")); render(); };

    const replayBtn = h("button", { class: "btn small", onclick: () => play() }, "↺ Replay");
    const undoBtn = h("button", { class: "btn small", onclick: undo }, "⌫ Undo");
    const revealBtn = h("button", { class: "btn small", onclick: reveal }, "Reveal");
    const checkBtn = h("button", { class: "btn small primary", onclick: check }, "Check ", h("kbd", {}, "↵"));
    const nextBtn = h("button", { class: "btn small primary", hidden: true, onclick: () => nextPhrase() }, "Next phrase ", h("kbd", {}, "↵"));

    phraseGame = {
      stop: () => cancel?.(),
      key: (e) => {
        if (e.key === " ") { e.preventDefault(); play(); }
        else if (e.key === "Backspace") { e.preventDefault(); undo(); }
        else if (e.key === "Enter") { e.preventDefault(); done ? nextPhrase() : check(); }
      },
    };
    render(); renderScore();
    box.replaceChildren(h("div", { class: "review-card phrase-game" },
      h("div", { class: "q", style: "padding:10px 14px 0;font-weight:600;color:var(--muted)" },
        "Watch the phrase, then build it from the tiles."),
      stage, h("div", { class: "phrase-tools" }, replayBtn, rate, undoBtn, revealBtn, checkBtn, nextBtn),
      answerRow, bankRow, feedback, scoreEl));
    play();
  }

  document.addEventListener("keydown", (e) => {
    if (e.target.closest?.("input, select, textarea") || e.metaKey || e.ctrlKey) return;
    if (modeSel.value === "phrase") { phraseGame?.key(e); return; }
    if (modeSel.value === "quiz") {
      if (!quiz) return;
      const n = Number(e.key);
      if (n >= 1 && n <= quiz.count) quiz.choose(n - 1);
      else if (e.key === "Enter" || e.key === " ") { e.preventDefault(); quiz.next(); }
      else if (e.key === "r" || e.key === "R") quiz.replay();
      else if (e.key === "s" || e.key === "S") quiz.toggleSlow();
      return;
    }
    if (modeSel.value === "match") {
      if (e.key === "Enter" && match?.done()) { e.preventDefault(); match.next(); }
      return;
    }
    if (modeSel.value === "spell") return;
    if (e.key === " " && !revealed) { e.preventDefault(); document.getElementById("card").reveal?.(); }
    else if (e.key === "1") grade("again");
    else if (e.key === "2") grade("hard");
    else if (e.key === "3") grade("good");
  });
  for (const el of [modeSel, deckSel, lessonSel]) el.addEventListener("change", () => {
    store.set("auslan.review.mode", modeSel.value);
    store.set("auslan.review.deck", deckSel.value);
    store.set("auslan.review.lesson", lessonSel.value);
    phraseGame?.stop();
    practiceAnyway = false;
    next();
  });
  next();
})();
</script>
</body>
</html>
